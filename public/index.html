<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Caloriecoach</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    form { display: grid; gap: .6rem; margin-bottom: 1.5rem; }
    label { display: grid; gap: .2rem; font-size: .9rem; }
    input, select, button { font-size: 1rem; padding: .5rem; }
    button { cursor: pointer; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: .4rem; border-bottom: 1px solid #ddd; }
    .getal { text-align: right; }
    .acties { white-space: nowrap; }
    .acties button { margin-left: .3rem; padding: .3rem .5rem; font-size: .9rem; }
    #melding { color: #b00020; min-height: 1.2rem; }
    form.wijzigen { background: #fff8e1; padding: .8rem; border-radius: 6px; }
    #suggesties { border: 1px solid #ccc; border-radius: 6px; background: #fff; max-height: 260px; overflow-y: auto; }
    #suggesties button { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid #eee; background: #fff; padding: .5rem .6rem; }
    #suggesties button:hover { background: #eef5ff; }
    #suggesties .info { padding: .5rem .6rem; color: #555; }
    #productInfo { font-size: .9rem; color: #2a6b2a; min-height: 1.1rem; }
  </style>
</head>
<body>
  <h1>Caloriecoach</h1>

  <h2 id="formTitel">Eten toevoegen</h2>
  <form id="etenForm">
    <label>Datum <input type="date" id="datum" required></label>
    <label>Maaltijd
      <select id="maaltijd">
        <option>Ontbijt</option>
        <option>Lunch</option>
        <option>Diner</option>
        <option>Tussendoor</option>
      </select>
    </label>
    <label>Omschrijving (typ om te zoeken)
      <input type="text" id="omschrijving" autocomplete="off" required>
    </label>
    <div id="suggesties" hidden></div>
    <div id="productInfo"></div>
    <label>Hoeveelheid (gram) <input type="number" id="gram" min="0" step="any"></label>
    <label>Calorieën (kcal) <input type="number" id="kcal" min="0" required></label>
    <button type="submit" id="opslaanKnop">Toevoegen</button>
    <button type="button" id="annuleerKnop" hidden>Annuleren</button>
    <div id="melding"></div>
  </form>

  <h2>Gegeten op <span id="datumTitel"></span></h2>
  <table>
    <thead>
      <tr><th>Maaltijd</th><th>Omschrijving</th><th class="getal">Gram</th><th class="getal">kcal</th><th class="getal">Eiwit (g)</th><th></th></tr>
    </thead>
    <tbody id="lijst"></tbody>
    <tfoot>
      <tr><th colspan="3">Totaal</th><th class="getal" id="totaal">0</th><th class="getal" id="totaalEiwit">0</th><th></th></tr>
    </tfoot>
  </table>

  
  <p style="font-size:.8rem;color:#666;margin-top:1.5rem;">
    Voedingswaarden: <a href="https://www.rivm.nl/nevo" target="_blank" rel="noopener">NEVO-online 2025/9.0 (RIVM)</a>
    en <a href="https://world.openfoodfacts.org" target="_blank" rel="noopener">Open Food Facts</a>.
  </p>

  <script>
    const formulier = document.getElementById('etenForm');
    const datumVeld = document.getElementById('datum');
    const omschrijvingVeld = document.getElementById('omschrijving');
    const gramVeld = document.getElementById('gram');
    const kcalVeld = document.getElementById('kcal');
    const suggestieBlok = document.getElementById('suggesties');
    const productInfo = document.getElementById('productInfo');
    const melding = document.getElementById('melding');
    const opslaanKnop = document.getElementById('opslaanKnop');
    const annuleerKnop = document.getElementById('annuleerKnop');
    const formTitel = document.getElementById('formTitel');

    // Het id van de regel die je nu wijzigt. null betekent: je voegt een nieuwe regel toe.
    let bewerkId = null;
    // Het gekozen product uit de zoeklijst: { kcal100, eiwit100 }, of null als je zelf invult
    let gekozen = null;
    let zoekTimer = null;

    // Getal netjes tonen met een komma, bijvoorbeeld 10,4
    function nl(n) {
      return n.toLocaleString('nl-NL', { maximumFractionDigits: 1 });
    }

    // Datum van vandaag in jouw tijdzone, in de vorm 2026-11-04
    function vandaag() {
      const d = new Date();
      d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
      return d.toISOString().slice(0, 10);
    }

    // ---------- Zoeken en berekenen ----------

    function toonProductInfo() {
      if (!gekozen) { productInfo.textContent = ''; return; }
      let tekst = 'Per 100 g: ' + nl(gekozen.kcal100) + ' kcal';
      if (gekozen.eiwit100 != null) tekst += ', ' + nl(gekozen.eiwit100) + ' g eiwit';
      tekst += '.';
      if (gramVeld.value === '') tekst += ' Vul de hoeveelheid in gram in om de calorieën uit te rekenen.';
      productInfo.textContent = tekst;
    }

    // kcal = kcal per 100 g x gram / 100
    function berekenUitProduct() {
      toonProductInfo();
      if (!gekozen || gramVeld.value === '') return;
      const gram = Number(gramVeld.value);
      if (isNaN(gram)) return;
      kcalVeld.value = Math.round(gekozen.kcal100 * gram / 100);
    }

    function verbergSuggesties() {
      suggestieBlok.hidden = true;
      suggestieBlok.innerHTML = '';
    }

    function toonBericht(tekst) {
      suggestieBlok.innerHTML = '';
      const div = document.createElement('div');
      div.className = 'info';
      div.textContent = tekst;
      suggestieBlok.appendChild(div);
      suggestieBlok.hidden = false;
    }

    function kiesProduct(p) {
      omschrijvingVeld.value = p.naam + (p.merk ? ' (' + p.merk + ')' : '');
      gekozen = { kcal100: p.kcal100, eiwit100: p.eiwit100 };
      verbergSuggesties();
      berekenUitProduct();
      if (gramVeld.value === '') gramVeld.focus();
    }

        function zoek(q) {
      const actueel = () => omschrijvingVeld.value.trim() === q;
      let basis = [];
      let merken = q.length >= 3 ? null : [];   // null betekent: nog bezig
      let merkFout = false;

      function teken() {
        if (!actueel()) return;   // je hebt intussen iets anders getypt
        suggestieBlok.innerHTML = '';
        for (const p of [...basis, ...(merken || [])]) {
          const knop = document.createElement('button');
          knop.type = 'button';
          knop.textContent = p.naam + (p.merk ? ' (' + p.merk + ')' : '')
            + ' – ' + p.kcal100 + ' kcal per 100 g · ' + p.bron;
          knop.addEventListener('click', () => kiesProduct(p));
          suggestieBlok.appendChild(knop);
        }
        let tekst = '';
        if (merken === null) tekst = 'Merkproducten zoeken…';
        else if (merkFout) tekst = 'Merkproducten zoeken lukt nu niet.';
        else if (basis.length === 0 && merken.length === 0) tekst = 'Geen producten gevonden. Vul de calorieën zelf in.';
        if (tekst) {
          const div = document.createElement('div');
          div.className = 'info';
          div.textContent = tekst;
          suggestieBlok.appendChild(div);
        }
        suggestieBlok.hidden = suggestieBlok.children.length === 0;
      }

      fetch('/api/zoek/basis?q=' + encodeURIComponent(q))
        .then(r => (r.ok ? r.json() : []))
        .catch(() => [])
        .then(lijst => { basis = lijst; teken(); });

      if (merken === null) {
        fetch('/api/zoek/merk?q=' + encodeURIComponent(q))
          .then(r => { if (!r.ok) throw new Error('mislukt'); return r.json(); })
          .then(lijst => { merken = lijst; })
          .catch(() => { merken = []; merkFout = true; })
          .then(teken);
      }
    }

    // Tijdens het typen: een nieuw woord betekent dat het gekozen product niet meer geldt
    omschrijvingVeld.addEventListener('input', () => {
      gekozen = null;
      toonProductInfo();
      clearTimeout(zoekTimer);
      const q = omschrijvingVeld.value.trim();
      if (q.length < 2) { verbergSuggesties(); return; }
      zoekTimer = setTimeout(() => zoek(q), 400);
    });

    gramVeld.addEventListener('input', berekenUitProduct);

    // ---------- Formulier: toevoegen of wijzigen ----------

    // Maakt het formulier leeg en zet het terug in de stand "toevoegen"
    function stopWijzigen() {
      bewerkId = null;
      gekozen = null;
      formulier.classList.remove('wijzigen');
      formTitel.textContent = 'Eten toevoegen';
      opslaanKnop.textContent = 'Toevoegen';
      annuleerKnop.hidden = true;
      omschrijvingVeld.value = '';
      gramVeld.value = '';
      kcalVeld.value = '';
      melding.textContent = '';
      verbergSuggesties();
      toonProductInfo();
    }

    // Zet een bestaande regel in het formulier, zodat je hem kunt aanpassen
    function startWijzigen(regel) {
      bewerkId = regel.id;
      formulier.classList.add('wijzigen');
      formTitel.textContent = 'Eten wijzigen';
      opslaanKnop.textContent = 'Opslaan';
      annuleerKnop.hidden = false;
      datumVeld.value = regel.datum;
      document.getElementById('maaltijd').value = regel.maaltijd;
      omschrijvingVeld.value = regel.omschrijving;
      gramVeld.value = regel.gram ?? '';
      kcalVeld.value = regel.kcal;
      gekozen = regel.kcal100 != null ? { kcal100: regel.kcal100, eiwit100: regel.eiwit100 } : null;
      melding.textContent = '';
      verbergSuggesties();
      toonProductInfo();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    formulier.addEventListener('submit', async (e) => {
      e.preventDefault();
      melding.textContent = '';
      const wijzigt = bewerkId !== null;

      // Eiwit van deze portie: eiwit per 100 g x gram / 100
      const gram = Number(gramVeld.value);
      let eiwit = '';
      if (gekozen && gekozen.eiwit100 != null && gramVeld.value !== '' && !isNaN(gram)) {
        eiwit = Math.round(gekozen.eiwit100 * gram / 100 * 10) / 10;
      }

      const antwoord = await fetch(wijzigt ? '/api/eten/' + bewerkId : '/api/eten', {
        method: wijzigt ? 'PUT' : 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          datum: datumVeld.value,
          maaltijd: document.getElementById('maaltijd').value,
          omschrijving: omschrijvingVeld.value,
          gram: gramVeld.value,
          kcal: kcalVeld.value,
          eiwit: eiwit,
          kcal100: gekozen ? gekozen.kcal100 : '',
          eiwit100: gekozen && gekozen.eiwit100 != null ? gekozen.eiwit100 : ''
        })
      });
      if (!antwoord.ok) {
        const fout = await antwoord.json();
        melding.textContent = fout.fout;
        return;
      }
      stopWijzigen();
      laadLijst();
    });

    annuleerKnop.addEventListener('click', stopWijzigen);

    // ---------- De lijst van de gekozen dag ----------

    async function laadLijst() {
      const datum = datumVeld.value;
      document.getElementById('datumTitel').textContent = datum;
      const antwoord = await fetch('/api/eten?datum=' + datum);
      const lijst = await antwoord.json();

      const tbody = document.getElementById('lijst');
      tbody.innerHTML = '';
      let totaal = 0;
      let totaalEiwit = 0;
      for (const regel of lijst) {
        const tr = document.createElement('tr');
        const waarden = [
          regel.maaltijd,
          regel.omschrijving,
          regel.gram ?? '',
          regel.kcal,
          regel.eiwit != null ? nl(regel.eiwit) : '–'
        ];
        waarden.forEach((w, i) => {
          const td = document.createElement('td');
          td.textContent = w;
          if (i >= 2) td.className = 'getal';
          tr.appendChild(td);
        });

        const tdActies = document.createElement('td');
        tdActies.className = 'acties';

        const wijzigKnop = document.createElement('button');
        wijzigKnop.textContent = 'Wijzig';
        wijzigKnop.addEventListener('click', () => startWijzigen(regel));
        tdActies.appendChild(wijzigKnop);

        const verwijderKnop = document.createElement('button');
        verwijderKnop.textContent = 'Verwijder';
        verwijderKnop.addEventListener('click', async () => {
          if (!confirm('Deze regel verwijderen?')) return;
          await fetch('/api/eten/' + regel.id, { method: 'DELETE' });
          if (bewerkId === regel.id) stopWijzigen();
          laadLijst();
        });
        tdActies.appendChild(verwijderKnop);

        tr.appendChild(tdActies);
        tbody.appendChild(tr);
        totaal += regel.kcal;
        if (regel.eiwit != null) totaalEiwit += regel.eiwit;
      }
      document.getElementById('totaal').textContent = totaal;
      document.getElementById('totaalEiwit').textContent = nl(totaalEiwit);
    }

    datumVeld.addEventListener('change', laadLijst);
    datumVeld.value = vandaag();
    laadLijst();
  </script>
</body>
</html>
